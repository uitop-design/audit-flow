name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: auditflow
          POSTGRES_PASSWORD: auditflow
          POSTGRES_DB: auditflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=auditflow --dbname=auditflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Integration tests refuse any database whose name does not end in _test.
      TEST_DATABASE_URL: postgresql://auditflow:auditflow@localhost:5432/auditflow_test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome (format, lint, imports)
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (API unit + integration, web)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: API contract is up to date
        run: |
          pnpm api:types
          git diff --exit-code -- apps/api/openapi.json apps/web/src/lib/api/schema.d.ts \
            || (echo "::error::OpenAPI document or generated web types are stale. Run 'pnpm api:types' and commit the result." && exit 1)

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: auditflow-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
